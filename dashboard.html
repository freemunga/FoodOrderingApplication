<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - Snacks Point</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body">

  <!-- Top Bar Stats & Logout -->
  <header class="top-nav-bar">
    <div class="client-hit-badge" id="clientHitDisplay">2 client hit for this app!</div>
    <button class="btn-logout" id="logoutBtn">logout</button>
  </header>

  <div class="dashboard-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="logo-box">
        <h1 class="logo-title">Snacks</h1>
        <span class="logo-subtitle">Point</span>
      </div>
      <nav class="sidebar-menu">
        <a href="#about" class="nav-item">About</a>
        <a href="#services" class="nav-item">Services</a>
        <a href="#orders" class="nav-item">Your Orders</a>
        <a href="#wishlists" class="nav-item">Wishlists (<span id="wishlistCount">0</span>)</a>
        <a href="#cart" class="nav-item">Cart (<span id="cartSidebarCount">0</span>)</a>
        <a href="#contact" class="nav-item">Contact</a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Search & Quick Action Toolbar -->
      <div class="toolbar">
        <div class="tool-pill search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="Search">
        </div>
        <div class="tool-pill">🏷️ Offers</div>
        <div class="tool-pill" id="cartPill">🛒 <span id="cartCount">0</span> Items</div>
        <div class="tool-pill">📍 Address</div>
      </div>

      <!-- Menu Grid & Category Filter Layout -->
      <div class="content-split">
        <section class="menu-section">
          <h2 class="category-header" id="currentCategoryHeading">Burger</h2>
          <div class="food-cards-grid" id="foodContainer">
            <!-- Dynamic Food Cards Rendered by script.js -->
          </div>
        </section>

        <!-- Right Side: Category Selection ("Go For Hunt") -->
        <aside class="category-sidebar">
          <h3>Go For Hunt</h3>
          <ul class="category-list">
            <li class="category-item active" data-category="Burger">
              <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=100&auto=format&fit=crop&q=60" alt="Burger">
              <span>Burger</span>
            </li>
            <li class="category-item" data-category="Burrito">
              <img src="https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=100&auto=format&fit=crop&q=60" alt="Burrito">
              <span>Burrito</span>
            </li>
            <li class="category-item" data-category="Desserts">
              <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=100&auto=format&fit=crop&q=60" alt="Desserts">
              <span>Desserts</span>
            </li>
            <li class="category-item" data-category="Donuts">
              <img src="https://images.unsplash.com/photo-1527515862127-a4fc05baf7a5?w=100&auto=format&fit=crop&q=60" alt="Donuts">
              <span>Donuts</span>
            </li>
            <li class="category-item" data-category="Pizza">
              <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=100&auto=format&fit=crop&q=60" alt="Pizza">
              <span>Pizza</span>
            </li>
          </ul>
        </aside>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
