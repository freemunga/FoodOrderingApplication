<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Snacks Point</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <div class="login-container">
    <!-- Left Section: Form -->
    <div class="login-form-section">
      <h2 class="brand-heading">Login</h2>
      <h3>Welcome back!</h3>
      <p class="sub-text">Enter your email address and password to access admin panel.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required placeholder="admin@gmail.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-login">Login</button>
          <button type="reset" class="btn btn-reset">Reset</button>
        </div>
      </form>
    </div>

    <!-- Right Section: Banner Theme -->
    <div class="login-banner-section">
      <div class="banner-overlay">
        <h2>This beautiful theme yours!</h2>
        <p>"Best investment I made for a long time. Can only recommend it for other users."</p>
        <span class="author">- Admin User</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
